[package]
name = "ferro-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.31.0"
egui-winit = "0.31.0"
egui_glow = { version = "0.31.0", features = ["winit"] }
glam = { version = "0.34.1", features = ["serde"] }
glow = "0.16.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
image = "0.25.10"
notify = "8.2.1"
raw-window-handle = "0.6.2"
rfd = "0.17.2"
rhai = "1.27.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
winit = "0.30.13"

[profile.release]
debug = true
