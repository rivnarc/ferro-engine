[package]
name = "ferro-engine"
version = "0.1.0"
edition = "2024"

[features]
default = ["editor"]
editor = ["dep:egui", "dep:egui-winit", "dep:egui_glow", "dep:rfd"]

[dependencies]
egui = { version = "0.31.0", optional = true }
egui-winit = { version = "0.31.0", optional = true }
egui_glow = { version = "0.31.0", features = ["winit"], optional = true }
glam = { version = "0.34.1", features = ["serde"] }
glow = "0.16.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
image = "0.25.10"
notify = "8.2.1"
raw-window-handle = "0.6.2"
rfd = { version = "0.17.2", optional = true }
rhai = "1.27.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
winit = "0.30.13"

[profile.release]
debug = true
